<!DOCTYPE html>
<html>
  <head>
    <title>Login Shopee</title>
    <link rel="stylesheet" href="assets/login.css">
  </head>
  <body> 
    <div class="header">
      <div class="header-left">
        <img class="ava-shop" src="assets/ava-shop.jpg" alt="">
        <h1>Login</h1>
      </div>
      <div class="header-right">
        <button>Bạn cần giúp đỡ?</button>
      </div>
    </div>
    <div class="login">
      <div class="background">
        <img class="background-shop" src="assets/background-shop.jpg" alt="">
      </div>
      <div class="login-frame">
        <div class="login-frame-login">
          <p>Đăng nhập</p>
          <div class="login-frame-code">
            <img class="login-code-guide" src="assets/login-code.png" alt="">
            <button><img class="login-code-form" src="assets/code.png"></button>
          </div>
        </div>
        <div class="login-input">
          <input type="text" placeholder="(+84) 123 456 789"/>
          <input type="password" />
          <button>ĐĂNG NHẬP</button>
        </div>
      </div>
    </div>

    <div class="footer">

    </div>
  </body>
</html>
